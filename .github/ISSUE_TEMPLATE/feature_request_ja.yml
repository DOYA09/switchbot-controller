name: 💡 機能リクエスト (Feature Request)
description: 新機能・対応デバイスの追加・改善を提案する
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ご提案ありがとうございます。「何が欲しいか」だけでなく「なぜ必要か」も教えていただけると、今後の開発の優先順位付けに役立ちます。

  - type: textarea
    id: description
    attributes:
      label: 提案する機能
      description: どのような機能の追加・変更を希望しますか？
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: 用途・必要な理由
      description: どのような課題を解決したいですか？その機能をどのように使いたいですか？
    validations:
      required: true

  - type: input
    id: related-device
    attributes:
      label: 関連するSwitchBotデバイス・機能
      description: 関連するSwitchBotデバイスや、既存のプラグイン機能があれば教えてください。
      placeholder: 例：SwitchBotロボット掃除機、シーンライブラリ、明るさ調整
    validations:
      required: false

  - type: textarea
    id: proposed-solution
    attributes:
      label: 実現方法のアイデア
      description: どのように実現できそうか、アイデアがあれば教えてください。
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 代替案・補足情報
      description: 現在使っている代替手段や、他に補足したい情報があれば教えてください。
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 確認事項
      options:
        - label: 既存のIssueを検索し、同じ提案が無いことを確認しました。
          required: true
