<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>SwitchBot Single Action</title>
<script src="pi-common.js"></script>
<style>
	:root { color-scheme: dark; }
	* { box-sizing: border-box; }
	html, body {
		margin: 0;
		font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
		font-size: 12px;
		letter-spacing: -0.25pt;
		background: #2d2d2d;
		color: #9a9a9a;
	}
	body { padding: 8px 0 20px; }
	.hint {
		font-size: 10.5px;
		opacity: 0.65;
		margin: 2px 10px 10px;
		line-height: 1.5;
	}
	.field {
		display: flex;
		align-items: center;
		min-height: 30px;
		padding: 2px 10px;
	}
	.field > label {
		flex: 0 0 112px;
		text-align: right;
		padding-right: 8px;
		font-size: 12px;
		font-weight: normal;
		line-height: 1.3;
		word-break: keep-all;
	}
	.field > label:not(:empty):after { content: "："; }
	.field > .control {
		flex: 1 1 auto;
		display: flex;
		gap: 6px;
		align-items: center;
		min-width: 0;
	}
	.button-row { justify-content: flex-end; }
	input[type="text"], input[type="password"], select {
		flex: 1;
		background: #3d3d3d;
		border: 1px solid #303030;
		color: #d8d8d8;
		border-radius: 0;
		padding: 5px 6px;
		font-size: 12px;
		min-width: 0;
		font-weight: normal;
	}
	input:focus, select:focus { outline: 1px solid #6c6c6c; }
	.checkbox-row { display: flex; align-items: center; gap: 6px; }
	.checkbox-row input { width: auto; flex: none; }
	button {
		background: #3d3d3d;
		border: 1px solid #6e6e6e;
		color: #d8d8d8;
		border-radius: 0;
		padding: 0 10px;
		min-height: 23px;
		height: 23px;
		font-size: 11px;
		cursor: pointer;
		white-space: nowrap;
	}
	button:hover { background: #4a4a4a; }
	button:disabled { opacity: 0.5; cursor: default; }
	.status-msg { font-size: 10.5px; margin: 2px 10px 8px 130px; min-height: 14px; }
	.status-msg.error { color: #ff8a8a; }
	.status-msg.ok { color: #8adfc4; }
	::-webkit-scrollbar { width: 8px; }
	::-webkit-scrollbar-track { box-shadow: inset 0 0 6px rgba(0,0,0,0.3); margin: 4px; border-radius: 8px; }
	::-webkit-scrollbar-thumb { background-color: #999999; outline: 1px solid slategrey; border-radius: 8px; }
</style>
</head>
<body>

	<!-- ===== SwitchBot API 共通設定（全キーで共有） ===== -->
	<div class="field">
		<label data-i18n="label.token">トークン</label>
		<div class="control"><input type="password" id="g-token" autocomplete="off" /></div>
	</div>
	<div class="field">
		<label data-i18n="label.secret">クライアントシークレット</label>
		<div class="control"><input type="password" id="g-secret" autocomplete="off" /></div>
	</div>
	<div class="field">
		<label></label>
		<div class="control checkbox-row">
			<input type="checkbox" id="show-credentials" />
			<label for="show-credentials" data-i18n="label.show_credentials">入力内容を表示</label>
		</div>
	</div>
	<div class="hint" data-i18n="hint.credentials">トークン / クライアントシークレットは他のSwitchBotアクションと共有されます。SwitchBotアプリの「プロフィール」→「設定」→バージョン表示を連続タップすると表示される「開発者向けオプション」から取得できます。</div>

	<div class="field">
		<label data-i18n="label.target">対象</label>
		<div class="control">
			<select id="targetType">
				<option value="device" data-i18n="option.target.device">デバイス</option>
				<option value="scene" data-i18n="option.target.scene">シーン</option>
			</select>
		</div>
	</div>
	<div id="device-fields">
		<div class="field">
			<label data-i18n="label.device">デバイス</label>
			<div class="control">
				<select id="deviceSelect"></select>
			</div>
		</div>
		<div class="field">
			<label data-i18n="label.command">コマンド</label>
			<div class="control"><select id="command"></select></div>
		</div>
		<div class="field button-field">
			<label></label>
			<div class="control button-row">
				<button type="button" id="device-refresh" data-i18n="button.refresh">更新</button>
			</div>
		</div>
		<div class="field" id="param-field" style="display:none">
			<label id="param-label" data-i18n="label.parameter">パラメーター</label>
			<div class="control"><input type="text" id="parameter" /></div>
		</div>
		<div id="ac-fields-container"></div>
		<div class="field" id="custom-command-field" style="display:none">
			<label data-i18n="label.custom_command_name">コマンド名</label>
			<div class="control"><input type="text" id="customCommand" data-i18n-placeholder="placeholder.custom_command" placeholder="例: setMode" /></div>
		</div>
		<div class="field" id="command-type-field" style="display:none">
			<label data-i18n="label.command_type">コマンド種別</label>
			<div class="control">
				<select id="commandType">
					<option value="command">command</option>
					<option value="customize">customize</option>
				</select>
			</div>
		</div>
	</div>
	<div id="scene-fields">
		<div class="field">
			<label data-i18n="label.scene">シーン</label>
			<div class="control">
				<select id="sceneSelect"></select>
			</div>
		</div>
		<div class="field button-field">
			<label></label>
			<div class="control button-row">
				<button type="button" id="scene-refresh" data-i18n="button.refresh">更新</button>
			</div>
		</div>
	</div>

	<div id="global-status" class="status-msg"></div>

	<script>
	(function () {
		"use strict";

		var PI = window.SwitchBotPI;
		var websocket = null;
		var piUUID = null;
		var actionInfo = null;
		var settings = {};
		var globalSettings = {};
		var deviceList = [];
		var sceneList = [];
		var suppressSave = false;
		var lastDeviceCacheAt = 0;
		var lastSceneCacheAt = 0;
		var lastErrorAt = 0;

		function el(id) { return document.getElementById(id); }

		function ensureDefaults() {
			if (!settings.operation) {
				settings.operation = {
					targetType: "device", deviceId: "", deviceName: "", deviceType: "", sceneId: "", sceneName: "",
					command: "", customCommand: "", commandType: "command", parameter: "default"
				};
			}
			if (settings.operation.deviceType === undefined) settings.operation.deviceType = "";
		}

		function refreshCommandOptions() {
			var op = settings.operation;
			var select = el("command");
			var previous = op.command;
			select.innerHTML = PI.buildCommandOptionsHtml(op.deviceType);

			var allowedValues = Array.prototype.map.call(select.options, function (o) { return o.value; });
			if (allowedValues.indexOf(previous) === -1) {
				op.command = allowedValues[0] !== undefined ? allowedValues[0] : "";
			}
			select.value = op.command;
		}

		function applySettingsToForm() {
			ensureDefaults();
			suppressSave = true;

			var op = settings.operation;
			el("targetType").value = op.targetType;
			refreshCommandOptions();
			el("parameter").value = op.parameter;
			el("customCommand").value = op.customCommand;
			el("commandType").value = op.commandType;
			PI.applyAcFieldsToForm(el, "", op);

			PI.populateSelect(el("deviceSelect"), deviceList, "deviceId", "deviceName", op.deviceId, op.deviceName, "deviceType");
			PI.populateSelect(el("sceneSelect"), sceneList, "sceneId", "sceneName", op.sceneId, op.sceneName);

			updateTargetVisibility();
			updateParamVisibility();

			suppressSave = false;
		}

		function updateTargetVisibility() {
			var isDevice = el("targetType").value === "device";
			el("device-fields").style.display = isDevice ? "" : "none";
			el("scene-fields").style.display = isDevice ? "none" : "";
		}

		function updateParamVisibility(forceReset) {
			var command = el("command").value;
			var meta = PI.getParamMeta(command);
			var isCustom = command === "custom";

			el("custom-command-field").style.display = isCustom ? "" : "none";
			el("command-type-field").style.display = isCustom ? "" : "none";
			PI.updateAcFieldVisibility(el, "", command);

			if (meta) {
				el("param-field").style.display = "";
				el("param-label").textContent = meta.label;
				el("parameter").placeholder = meta.placeholder;
				var current = el("parameter").value;
				if (forceReset || !current || current === "default") {
					el("parameter").value = meta.default;
					settings.operation.parameter = meta.default;
				}
			} else {
				el("param-field").style.display = "none";
			}
		}

		function bindEvents() {
			PI.bindAcFieldEvents(el, "", function () { return settings.operation; }, saveSettings);
			el("targetType").addEventListener("change", function (e) {
				settings.operation.targetType = e.target.value;
				updateTargetVisibility();
				saveSettings();
			});
			el("command").addEventListener("change", function (e) {
				settings.operation.command = e.target.value;
				updateParamVisibility(true);
				saveSettings();
			});
			el("parameter").addEventListener("input", function (e) {
				settings.operation.parameter = e.target.value;
				saveSettings();
			});
			el("customCommand").addEventListener("input", function (e) {
				settings.operation.customCommand = e.target.value;
				saveSettings();
			});
			el("commandType").addEventListener("change", function (e) {
				settings.operation.commandType = e.target.value;
				saveSettings();
			});
			el("deviceSelect").addEventListener("change", function (e) {
				var opt = e.target.selectedOptions[0];
				settings.operation.deviceId = e.target.value;
				settings.operation.deviceName = e.target.value ? opt.textContent : "";
				settings.operation.deviceType = e.target.value ? (opt.getAttribute("data-type") || "") : "";
				settings.operation.command = "";
				refreshCommandOptions();
				updateParamVisibility(true);
				saveSettings();
			});
			el("sceneSelect").addEventListener("change", function (e) {
				var opt = e.target.selectedOptions[0];
				settings.operation.sceneId = e.target.value;
				settings.operation.sceneName = e.target.value ? opt.textContent : "";
				saveSettings();
			});
			el("device-refresh").addEventListener("click", function () {
				requestList("devices", el("device-refresh"));
			});
			el("scene-refresh").addEventListener("click", function () {
				requestList("scenes", el("scene-refresh"));
			});
			el("g-token").addEventListener("input", function (e) {
				globalSettings.token = e.target.value;
				saveGlobalSettings();
			});
			el("g-secret").addEventListener("input", function (e) {
				globalSettings.secret = e.target.value;
				saveGlobalSettings();
			});
			el("show-credentials").addEventListener("change", function (e) {
				var type = e.target.checked ? "text" : "password";
				el("g-token").type = type;
				el("g-secret").type = type;
			});
		}

		function saveSettings() {
			if (suppressSave || !websocket || websocket.readyState !== 1) return;
			websocket.send(JSON.stringify({ event: "setSettings", context: piUUID, payload: settings }));
		}

		function saveGlobalSettings() {
			if (!websocket || websocket.readyState !== 1) return;
			websocket.send(JSON.stringify({ event: "setGlobalSettings", context: piUUID, payload: globalSettings }));
		}

		function requestList(kind, btn) {
			if (!websocket || websocket.readyState !== 1) return;
			if (!globalSettings.token || !globalSettings.secret) {
				showStatus(PI.t("status.credentials_missing_input"), true);
				return;
			}
			if (btn) { btn.disabled = true; btn.textContent = PI.t("button.refreshing"); }
			showStatus("", false);
			websocket.send(JSON.stringify({
				action: actionInfo.action,
				event: "sendToPlugin",
				context: piUUID,
				payload: { event: kind === "devices" ? "getDevices" : "getScenes" }
			}));
			setTimeout(function () {
				if (btn) { btn.disabled = false; btn.textContent = PI.t("button.refresh"); }
			}, 4000);
		}

		function showStatus(msg, isError) {
			var box = el("global-status");
			box.textContent = msg;
			box.className = "status-msg" + (msg ? (isError ? " error" : " ok") : "");
		}

		function handlePluginMessage(payload) {
			if (!payload || !payload.event) return;
			["device-refresh", "scene-refresh"].forEach(function (id) {
				var btn = el(id);
				if (btn) { btn.disabled = false; btn.textContent = PI.t("button.refresh"); }
			});

			if (payload.event === "devices") {
				deviceList = payload.devices || [];
				applySettingsToForm();
				showStatus(PI.t("status.devices_updated", { count: deviceList.length }), false);
			} else if (payload.event === "scenes") {
				sceneList = payload.scenes || [];
				applySettingsToForm();
				showStatus(PI.t("status.scenes_updated", { count: sceneList.length }), false);
			} else if (payload.event === "error") {
				var keys = {
					"credentials-missing": "error.credentials_missing",
					"fetch-devices-failed": "error.fetch_devices_failed",
					"fetch-scenes-failed": "error.fetch_scenes_failed",
					"unexpected-error": "error.unexpected"
				};
				showStatus(PI.t(keys[payload.message] || "error.generic"), true);
			}
		}

		window.connectElgatoStreamDeckSocket = function (inPort, inUUID, inRegisterEvent, inInfo, inActionInfo) {
			piUUID = inUUID;
			actionInfo = JSON.parse(inActionInfo);
			settings = (actionInfo.payload && actionInfo.payload.settings) || {};

			var info = JSON.parse(inInfo);
			PI.setLanguage(info.application && info.application.language);
			PI.applyStaticI18n();
			el("ac-fields-container").innerHTML = PI.buildAcDetailFieldsHtml("") + PI.buildAcAdjustFieldHtml("");

			websocket = new WebSocket("ws://127.0.0.1:" + inPort);

			websocket.onopen = function () {
				websocket.send(JSON.stringify({ event: inRegisterEvent, uuid: inUUID }));
				websocket.send(JSON.stringify({ event: "getGlobalSettings", context: inUUID }));
				bindEvents();
				applySettingsToForm();
			};

			websocket.onmessage = function (evt) {
				var data = JSON.parse(evt.data);
				if (data.event === "didReceiveSettings") {
					settings = (data.payload && data.payload.settings) || {};
					applySettingsToForm();
				} else if (data.event === "didReceiveGlobalSettings") {
					globalSettings = (data.payload && data.payload.settings) || {};
					el("g-token").value = globalSettings.token || "";
					el("g-secret").value = globalSettings.secret || "";

					if (globalSettings.deviceListCache && globalSettings.deviceListCache.updatedAt > lastDeviceCacheAt) {
						lastDeviceCacheAt = globalSettings.deviceListCache.updatedAt;
						handlePluginMessage({ event: "devices", devices: globalSettings.deviceListCache.devices });
					}
					if (globalSettings.sceneListCache && globalSettings.sceneListCache.updatedAt > lastSceneCacheAt) {
						lastSceneCacheAt = globalSettings.sceneListCache.updatedAt;
						handlePluginMessage({ event: "scenes", scenes: globalSettings.sceneListCache.scenes });
					}
					if (globalSettings.listError && globalSettings.listError.updatedAt > lastErrorAt) {
						lastErrorAt = globalSettings.listError.updatedAt;
						handlePluginMessage({ event: "error", message: globalSettings.listError.message });
					}

					if (globalSettings.token && globalSettings.secret) {
						if (deviceList.length === 0) requestList("devices");
						if (sceneList.length === 0) requestList("scenes");
					}
				} else if (data.event === "sendToPropertyInspector") {
					handlePluginMessage(data.payload);
				}
			};
		};
	})();
	</script>
</body>
</html>
